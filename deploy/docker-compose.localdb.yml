# Overlay: Postgres on the same server (replies stay fast: the app makes many small queries per reply).
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.localdb.yml up -d
# Needs REFLEXO_DB_OWNER_PASSWORD, REFLEXO_APP_DB_PASSWORD, REFLEXO_SERVICE_DB_PASSWORD in .env; the database URLs
# below replace any managed-database URLs from .env.

x-db-env: &db-env
  REFLEXO_DATABASE_URL: postgresql+asyncpg://reflexo_app:${REFLEXO_APP_DB_PASSWORD}@postgres:5432/reflexo
  REFLEXO_DATABASE_SERVICE_URL: postgresql+asyncpg://reflexo_service:${REFLEXO_SERVICE_DB_PASSWORD}@postgres:5432/reflexo
  REFLEXO_DATABASE_OWNER_URL: postgresql+asyncpg://reflexo_owner:${REFLEXO_DB_OWNER_PASSWORD}@postgres:5432/reflexo

x-needs-db: &needs-db
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reflexo_owner
      POSTGRES_PASSWORD: ${REFLEXO_DB_OWNER_PASSWORD}
      POSTGRES_DB: reflexo
      REFLEXO_APP_DB_PASSWORD: ${REFLEXO_APP_DB_PASSWORD}
      REFLEXO_SERVICE_DB_PASSWORD: ${REFLEXO_SERVICE_DB_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${REFLEXO_DB_OWNER_PASSWORD}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    ports: ["127.0.0.1:5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflexo_owner -d reflexo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *needs-db
    environment: *db-env
  worker:
    <<: *needs-db
    environment: *db-env
  temporal-worker:
    <<: *needs-db
    environment: *db-env
  voice-agent:
    <<: *needs-db
    environment: *db-env
  voice-bridge:  # host network: the database is on 127.0.0.1
    <<: *needs-db
    environment:
      REFLEXO_DATABASE_URL: postgresql+asyncpg://reflexo_app:${REFLEXO_APP_DB_PASSWORD}@127.0.0.1:5442/reflexo
      REFLEXO_DATABASE_SERVICE_URL: postgresql+asyncpg://reflexo_service:${REFLEXO_SERVICE_DB_PASSWORD}@127.0.0.1:5442/reflexo
      REFLEXO_DATABASE_OWNER_URL: postgresql+asyncpg://reflexo_owner:${REFLEXO_DB_OWNER_PASSWORD}@127.0.0.1:5442/reflexo

volumes:
  pgdata:
