# REFLEXO on one server (the public POC). The database (managed Postgres, e.g. Neon) and Temporal run elsewhere:
# their addresses come from .env (REFLEXO_DATABASE_URL / _SERVICE_URL / _OWNER_URL, REFLEXO_TEMPORAL_ADDRESS).
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Only Caddy (80/443) is reachable from outside. Redis listens on 127.0.0.1 for the voice-bridge, which runs on
# the host network (its WebRTC leg to WhatsApp needs the server's own addresses).

name: reflexo

x-app: &app
  build: {context: .., dockerfile: Dockerfile}
  image: reflexo:prod
  env_file: ../.env
  environment: &app-env
    REFLEXO_REDIS_URL: redis://redis:6379/0
    REFLEXO_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    REFLEXO_MEDIA_DIR: /data/media
  volumes: [media:/data/media]
  depends_on:
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1:6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && uvicorn reflexo.api.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*'"]

  worker:
    <<: *app
    command: ["python", "scripts/supervise.py", "-m", "reflexo.pipeline.worker"]

  temporal-worker:
    <<: *app
    command: ["python", "-m", "reflexo.workflows.worker"]

  voice-agent:
    <<: *app
    command: ["python", "scripts/supervise.py", "-m", "reflexo.voice.agent_worker", "start"]

  voice-bridge:
    <<: *app
    network_mode: host
    environment:
      <<: *app-env
      REFLEXO_REDIS_URL: redis://127.0.0.1:6390/0
    command: ["python", "-m", "reflexo.voice.bridge_worker"]

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      REFLEXO_DOMAIN: ${REFLEXO_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  media:
  caddy_data:
  caddy_config:
