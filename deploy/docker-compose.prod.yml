# REFLEXO on one server (the public POC): everything in containers, only HTTPS (Caddy) reachable from outside.
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Postgres, Redis and Temporal listen on 127.0.0.1 only: the voice-bridge runs on the host network (its WebRTC
# leg to WhatsApp needs the server's own addresses) and reaches them there.

name: reflexo

x-app: &app
  build: {context: .., dockerfile: Dockerfile}
  image: reflexo:prod
  env_file: ../.env
  environment: &app-env
    REFLEXO_DATABASE_URL: postgresql+asyncpg://reflexo_app:${REFLEXO_APP_DB_PASSWORD}@postgres:5432/reflexo
    REFLEXO_DATABASE_SERVICE_URL: postgresql+asyncpg://reflexo_service:${REFLEXO_SERVICE_DB_PASSWORD}@postgres:5432/reflexo
    REFLEXO_DATABASE_OWNER_URL: postgresql+asyncpg://reflexo_owner:${REFLEXO_DB_OWNER_PASSWORD}@postgres:5432/reflexo
    REFLEXO_REDIS_URL: redis://redis:6379/0
    REFLEXO_TEMPORAL_ADDRESS: temporal:7233
    REFLEXO_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    REFLEXO_MEDIA_DIR: /data/media
  volumes: [media:/data/media]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reflexo_owner
      POSTGRES_PASSWORD: ${REFLEXO_DB_OWNER_PASSWORD}
      POSTGRES_DB: reflexo
      REFLEXO_APP_DB_PASSWORD: ${REFLEXO_APP_DB_PASSWORD}
      REFLEXO_SERVICE_DB_PASSWORD: ${REFLEXO_SERVICE_DB_PASSWORD}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["127.0.0.1:5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflexo_owner -d reflexo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["127.0.0.1:6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: postgres
    ports: ["127.0.0.1:7243:7233"]
    restart: unless-stopped

  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && uvicorn reflexo.api.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*'"]

  worker:
    <<: *app
    command: ["python", "scripts/supervise.py", "-m", "reflexo.pipeline.worker"]

  temporal-worker:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      temporal: {condition: service_started}
    command: ["python", "-m", "reflexo.workflows.worker"]

  voice-agent:
    <<: *app
    command: ["python", "scripts/supervise.py", "-m", "reflexo.voice.agent_worker", "start"]

  voice-bridge:
    <<: *app
    network_mode: host
    environment:
      <<: *app-env
      REFLEXO_DATABASE_URL: postgresql+asyncpg://reflexo_app:${REFLEXO_APP_DB_PASSWORD}@127.0.0.1:5442/reflexo
      REFLEXO_DATABASE_SERVICE_URL: postgresql+asyncpg://reflexo_service:${REFLEXO_SERVICE_DB_PASSWORD}@127.0.0.1:5442/reflexo
      REFLEXO_DATABASE_OWNER_URL: postgresql+asyncpg://reflexo_owner:${REFLEXO_DB_OWNER_PASSWORD}@127.0.0.1:5442/reflexo
      REFLEXO_REDIS_URL: redis://127.0.0.1:6390/0
      REFLEXO_TEMPORAL_ADDRESS: 127.0.0.1:7243
    command: ["python", "-m", "reflexo.voice.bridge_worker"]

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      REFLEXO_DOMAIN: ${REFLEXO_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
