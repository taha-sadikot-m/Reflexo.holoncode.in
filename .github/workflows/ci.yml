name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run python tasks.py lint        # ruff, format, boundaries, guards, traceability (CHK-Q-1), fixtures (CHK-Q-6), fixed text (CHK-MSG-4)
      - run: uv run python tasks.py typecheck
      - run: uv run python scripts/check_audit.py pip   # CHK-SEC-12: high or critical Python findings fail
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
      - run: npm ci --no-fund --prefix apps/admin && python scripts/check_audit.py npm   # CHK-SEC-12: npm high findings fail

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      # integration tests use testcontainers (Docker is available on ubuntu runners)
      - run: docker build -t reflexo-policy-check:0.1.0 tools/policy-check   # the rule checker (BETA_04 §7.6)
      - run: uv run python -m pytest -m bench   # timing benchmarks first, on a fresh runner (CHK-POL-7)
      - run: uv run python -m pytest --cov=reflexo --cov-branch --cov-report=json:coverage.json --cov-report=term:skip-covered
      - run: uv run python scripts/check_coverage.py coverage.json   # CHK-Q-2: safety core >= 90%, ratchet 0.5 points
