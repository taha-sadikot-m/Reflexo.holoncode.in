[package]
name = "reflexo-policy-check"
version = "0.1.0"
edition = "2021"
publish = false
description = "Verifies Reflexo's Cedar policy sets before a rule goes live (BETA_04 §7.6)"
license = "Apache-2.0"

[[bin]]
name = "reflexo-policy-check"
path = "src/main.rs"

[dependencies]
cedar-policy = "=4.13.0"
cedar-policy-symcc = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
