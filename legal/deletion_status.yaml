# What the data-deletion status page says for each state (BETA_10 §8.3). Shown with the confirmation code.
none: "We hold no data about this account. There is nothing to delete."
received: "Your request has been received. We will complete it within 30 days."
in_progress: "Your request is being processed."
completed: "Your request is complete. Your data has been deleted."
unknown: "We do not recognise this confirmation code. Please check it, or write to {privacy_email}."
