# Orders and payments (BETA_12 §9.1): complex turns with tools and capabilities. Payment links in the benchmark are
# simulated (BETA_04 §15.10): `pay_last_link` pays through the signed webhook path. Orders are cancelled after each
# conversation (scenario cleanup), so capacity never fills up across the run.
group: orders_payments
conversations:
  # ---------------------------------------------------------------- order, confirm, pay (12)
  - id: op-pay-01
    steps:
      - {actor: c, send_text: "I want a 1 kg chocolate truffle cake day after tomorrow, 4-8 pm, Kothrud 411038, not eggless"}
      - {wait_for: {reply_contains: ["total", "Total"]}, timeout_s: 90}
      - {actor: c, send_text: "Yes that's right, please confirm, I'll pay online"}
      - {wait_for: {payment_link_created: true}, timeout_s: 90}
      - {pay_last_link: c}
      - {wait_for: {order_status: confirmed}, timeout_s: 60}
  - id: op-pay-02
    steps:
      - {actor: c, send_text: "1 kg red velvet chahiye parso, 1pm-4pm, Warje 411058, eggless"}
      - {wait_for: {reply_contains: ["total", "Total"]}, timeout_s: 90}
      - {actor: c, send_text: "haan theek hai, confirm karo, online pay karunga"}
      - {wait_for: {payment_link_created: true}, timeout_s: 90}
      - {pay_last_link: c}
      - {wait_for: {order_status: confirmed}, timeout_s: 60}
  - id: op-pay-03
    steps:
      - {actor: c, send_text: "Order one pineapple cake 1 kg for day after tomorrow, 10am-1pm slot, Erandwane 411004, regular (not eggless)"}
