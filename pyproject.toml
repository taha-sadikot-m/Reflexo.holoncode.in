[project]
name = "reflexo"
version = "0.1.0"
description = "REFLEXO — AI employee for Indian product sellers (proof of concept)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-asyncpg>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "pyyaml>=6.0",
  "phonenumbers>=8.13",
  "tzdata>=2024.1",
  "google-genai>=1.30",
  "langchain-core>=0.3",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "livekit==1.1.15",
  "livekit-api==1.2.1",
  "livekit-agents==1.7.1",
  "livekit-plugins-deepgram==1.7.1",
  "livekit-plugins-google==1.7.1",
  "livekit-plugins-silero==1.7.1",
  "aiortc==1.15.0",
  "numpy>=1.26",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres,redis]>=4.8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reflexo"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S603", "S607"]
"tasks.py" = ["S603", "S607"]
"src/reflexo/*/api.py" = ["E501"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["reflexo"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reflexo.common.*", "reflexo.pipeline.*", "reflexo.gateway.*", "reflexo.voice.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Docker (Postgres/Redis testcontainers)",
  "live: calls real external providers; opt-in with --live",
]
addopts = "-ra"
pythonpath = [".", "src"]
